
services:
  app:
    build:
      context: https://github.com/basharalsheikh/Jobico.git#main
      target: app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:?DOCKER_DB_DATABASE is required}
      DB_USERNAME: ${DOCKER_DB_USERNAME:?DOCKER_DB_USERNAME is required}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?DOCKER_DB_PASSWORD is required}
    volumes:
      - app_storage:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: https://github.com/basharalsheikh/Jobico.git#main
      target: web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - app_storage:/var/www/html/storage/app/public:ro
    depends_on:
      - app

  queue:
    build:
      context: https://github.com/basharalsheikh/Jobico.git#main
      target: app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=90
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:?DOCKER_DB_DATABASE is required}
      DB_USERNAME: ${DOCKER_DB_USERNAME:?DOCKER_DB_USERNAME is required}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?DOCKER_DB_PASSWORD is required}
    volumes:
      - app_storage:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DOCKER_DB_DATABASE:?DOCKER_DB_DATABASE is required}
      MARIADB_USER: ${DOCKER_DB_USERNAME:?DOCKER_DB_USERNAME is required}
      MARIADB_PASSWORD: ${DOCKER_DB_PASSWORD:?DOCKER_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?DOCKER_DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  app_storage:
